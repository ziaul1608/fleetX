server:
  port: 0

spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:fleetx_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: false

logging:
  level:
    root: WARN
    com.fleetx: INFO
