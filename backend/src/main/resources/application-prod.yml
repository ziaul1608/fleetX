# ==============================================================================
# FleetX Production Profile Configuration (application-prod.yml)
# Active when SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0

  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: ${COOKIE_SAME_SITE:lax}
        secure: ${COOKIE_SECURE:true}

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # Production MySQL Connection — Supports standard Spring, Aiven, or cloud database URLs with mandatory TLS
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fleetx}?useSSL=true&requireSSL=true&sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

logging:
  level:
    root: WARN
    com.fleetx: INFO
    org.springframework.security: WARN

# Production Security & Seed Guards
fleetx:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.onrender.com,https://fleetx.local,http://localhost:8080,http://127.0.0.1:8080}
  bootstrap:
    admin:
      # Disabled by default; requires explicit BOOTSTRAP_ADMIN_ENABLED=true and non-empty password
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@fleetx.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${BOOTSTRAP_ADMIN_NAME:FleetX Administrator}
      password-override: ${BOOTSTRAP_ADMIN_PASSWORD_OVERRIDE:false}
  demo:
    seed:
      # STRICTLY DISABLED IN PRODUCTION: No mock vehicles, demo drivers, or test trips
      enabled: false
