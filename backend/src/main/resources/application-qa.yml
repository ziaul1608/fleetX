# ==============================================================================
# FleetX QA Profile Configuration (application-qa.yml)
# Active when SPRING_PROFILES_ACTIVE=qa
# Dedicated to Isolated Real MySQL 8.4 Persistence Testing
# ==============================================================================

spring:
  config:
    activate:
      on-profile: qa

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/fleetx_qa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:fleetx_user}
    password: ${SPRING_DATASOURCE_PASSWORD:fleetx_dev_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${PORT:${SERVER_PORT:8080}}

  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: false

logging:
  level:
    root: INFO
    com.fleetx: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO

fleetx:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@fleetx.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:DevAdmin123!}
      full-name: ${BOOTSTRAP_ADMIN_NAME:FleetX Administrator}
  demo:
    seed:
      # Disabled in QA persistence testing to verify clean migrations and manual API workflows
      enabled: ${DEMO_SEED_ENABLED:false}
