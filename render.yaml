# ==============================================================================
# FleetX Render Infrastructure as Code Blueprint (render.yaml)
# Target: Free Public Deployment (Single Public Origin: React 18 + Spring Boot 3.5.x)
# ==============================================================================

services:
  - type: web
    name: fleetx
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # Profile & Runtime Configuration
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

      # External Free Aiven MySQL 8.4 Datasource (Secure TLS)
      # These variables are marked sync: false so secrets are entered in Render Dashboard
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # Security, Cookies & HTTPS Protection
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # One-Time Production Admin Bootstrap (Disabled by default)
      - key: BOOTSTRAP_ADMIN_ENABLED
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD_OVERRIDE
        sync: false

      # Production HTTPS Transactional Email Delivery (Resend REST API)
      # Bypasses Render outbound SMTP port blocking (ports 25, 465, 587)
      - key: RESEND_API_KEY
        sync: false
      - key: FLEETX_MAIL_FROM
        sync: false
      - key: FLEETX_OTP_HMAC_SECRET
        sync: false
