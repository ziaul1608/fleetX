services:
  mysql:
    image: mysql:8.4
    container_name: fleetx-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fleetx}
      MYSQL_USER: ${MYSQL_USER:-fleetx_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fleetx_dev_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - fleetx_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_dev_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci


volumes:
  fleetx_mysql_data:
    driver: local
